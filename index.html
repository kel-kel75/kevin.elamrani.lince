  <style>
    /* POLICE ET VARIABLES TERMINAL HACKER */
    :root {
      --bg-color: #030a03;
      --term-green: #00ff41;
      --term-green-dim: #008f11;
      --term-green-glow: rgba(0, 255, 65, 0.4);
      --font-stack: "Courier New", Courier, Lucida Console, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: var(--font-stack);
      margin: 0;
      padding: 20px;
      /* PASSAGE DU TEXTE EN MINUSCULES */
      text-transform: lowercase;
      /* Effet flou léger du phosphore des vieux moniteurs */
      text-shadow: 0 0 4px var(--term-green-glow);
      filter: contrast(1.1) brightness(1.05);
      position: relative;
      overflow-x: hidden;
    }

    /* EFFET EFFET BALAYAGE CATHODIQUE (SCANLINES + FLICKER) */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      z-index: 999;
      pointer-events: none;
      opacity: 0.7;
    }

    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: rgba(18, 16, 16, 0.1);
      opacity: 0;
      z-index: 998;
      pointer-events: none;
      animation: flicker 0.15s infinite;
    }

    /* SCINTILLEMENT LÉGER DE L'ÉCRAN CRT */
    @keyframes flicker {
      0% { opacity: 0.02; }
      50% { opacity: 0.06; }
      100% { opacity: 0.01; }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* HEADER STYLE SHELL / SYSTEM LOG */
    header {
      border: 1px solid var(--term-green-dim);
      padding: 15px;
      margin-bottom: 30px;
      background: rgba(0, 20, 0, 0.6);
      box-shadow: 0 0 10px var(--term-green-glow);
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 10px 0;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .prompt-line {
      font-size: 0.9rem;
      color: var(--term-green);
      margin: 5px 0;
      word-break: break-all;
    }

    .prompt-line span {
      color: #fff;
      text-shadow: 0 0 5px #fff;
    }

    /* CLIGNOTEMENT DU CURSEUR TERMINAL */
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      background: var(--term-green);
      vertical-align: bottom;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* GRILLE BRUTALE MATRIX */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .video-card {
      border: 1px dashed var(--term-green-dim);
      background: #000;
      padding: 8px;
      transition: all 0.2s ease-in-out;
    }

    .video-card:hover {
      border-style: solid;
      border-color: var(--term-green);
      box-shadow: 0 0 15px var(--term-green-glow);
      transform: scale(1.01);
    }

    /* DATALOG BADGE */
    .video-card::before {
      content: attr(data-id);
      display: block;
      font-size: 0.75rem;
      color: var(--term-green);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    /* LECTEUR IFRAME */
    .video-card iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #111;
      display: block;
      /* Effet flou cathodique subtil sur les vidéos */
      filter: blur(0.2px) contrast(1.05);
    }

    /* LIENS FOOTER STYLE CONSOLE */
    a {
      color: var(--term-green);
      text-decoration: none;
    }
    a:hover {
      background: var(--term-green);
      color: #000;
      text-shadow: none;
    }
  </style>
</head>
